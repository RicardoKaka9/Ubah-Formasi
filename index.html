<title>Squad Builder FINAL</title>

<style>
body{margin:0;font-family:Arial;background:#0b0b0b;color:#fff}
header{background:#000;padding:10px;text-align:center}
select{padding:6px;margin:4px}

.container{display:flex}
.field{
  width:65%;height:700px;
  background:linear-gradient(#1b5e20,#2e7d32);
  margin:10px;border-radius:16px;position:relative
}

.slot-xi.active,
.bench-slot.active,
.item.active{
  outline:3px solid #2196f3;
}

.slot-xi{
  position:absolute;width:130px;height:70px;
  background:rgba(0,0,0,.65);
  border:2px dashed #aaa;border-radius:10px;
  text-align:center;cursor:pointer;padding:4px
}
.slot-xi.good{border-color:#00e676}
.slot-xi.bad{border-color:#ff5252}
.slot-xi.active{outline:3px solid #2196f3}

.name{font-size:12px;font-weight:bold}
.pos{font-size:11px;opacity:.8}

.stamina{height:6px;background:#333;border-radius:4px;overflow:hidden;margin-top:4px}
.stamina div{height:100%;background:#00e676}

.sidebar{width:35%;padding:10px}
.list{border:1px solid #444;border-radius:8px;padding:6px;max-height:260px;overflow:auto}
.item{padding:6px;border-bottom:1px solid #333;cursor:pointer}
.item:hover{background:#333}

.bench{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.bench-slot{
  border:2px dashed #aaa;border-radius:8px;
  padding:6px;text-align:center;cursor:pointer
}
.bench-slot.active{outline:3px solid #2196f3}
</style>
</head>

const formations={
  433:[
    ["GK",50,90],
    ["LB",15,70],["CB",35,70],["CB",55,70],["RB",75,70],
    ["CM",30,45],["CM",50,45],["CM",70,45],
    ["LW",25,20],["ST",50,15],["RW",75,20]
  ],
  4231:[
    ["GK",50,90],
    ["LB",15,70],["CB",35,70],["CB",55,70],["RB",75,70],
    ["DM",40,45],["DM",60,45],
    ["AM",50,30],
    ["LW",25,25],["RW",75,25],
    ["ST",50,15]
  ]
};

// ================= STATE =================
let reserves = [];
let bench = new Array(9).fill(null);
let xi = [];

let selectedPlayer = null;
let selectedFrom = null;

// ================= INIT =================
const clubSelect = document.getElementById("clubSelect");
const formationSelect = document.getElementById("formationSelect");

Object.keys(clubs).forEach(k=>{
  const o=document.createElement("option");
  o.value=k;o.textContent=clubs[k].name;
  clubSelect.appendChild(o);
});

clubSelect.onchange = () => {
  if(!clubSelect.value) return;
  reserves = clubs[clubSelect.value].players.map(p=>({...p}));
  bench = new Array(9).fill(null);
  initXI();
  clearSelection();
  drawAll();
};

formationSelect.onchange = ()=>{
  initXI();
  clearSelection();
  drawAll();
};

function initXI(){
  xi = formations[formationSelect.value].map(f=>({
    role:f[0],x:f[1],y:f[2],player:null
  }));
}

// ================= DRAW =================
function drawAll(){
  drawField();
  drawBench();
  drawReserves();
}

function drawField(){
  const field=document.getElementById("field");
  field.innerHTML="";
  xi.forEach((s,i)=>{
    const d=document.createElement("div");
    d.className="slot-xi";
    d.style.left=s.x+"%";
    d.style.top=s.y+"%";

    if(s.player){
      d.innerHTML=`
        <div class="name">${s.player.name}</div>
        <div class="pos">${s.role}</div>
        <div class="stamina"><div style="width:${s.player.stamina}%"></div></div>
      `;
      d.onclick=()=>selectPlayer(s.player,"xi",i,d);
    }else{
      d.innerHTML=`<div class="pos">${s.role}</div>`;
      d.onclick=()=>placeHere("xi",i);
    }

    if(selectedFrom && selectedFrom.from==="xi" && selectedFrom.index===i){
      d.classList.add("active");
    }

    field.appendChild(d);
  });
}

function drawBench(){
  const b=document.getElementById("bench");
  b.innerHTML="";
  bench.forEach((p,i)=>{
    const d=document.createElement("div");
    d.className="bench-slot";

    if(p){
      d.innerHTML=`
        <div class="name">${p.name}</div>
        <div class="stamina"><div style="width:${p.stamina}%"></div></div>
      `;
      d.onclick=()=>selectPlayer(p,"bench",i,d);
    }else{
      d.innerHTML="Kosong";
      d.onclick=()=>placeHere("bench",i);
    }

    if(selectedFrom && selectedFrom.from==="bench" && selectedFrom.index===i){
      d.classList.add("active");
    }

    b.appendChild(d);
  });
}

function drawReserves(){
  const r=document.getElementById("reserves");
  r.innerHTML="";
  reserves.forEach((p,i)=>{
    const d=document.createElement("div");
    d.className="item";
    d.innerHTML=`
      ${p.name}
      <div class="stamina"><div style="width:${p.stamina}%"></div></div>
    `;
    d.onclick=()=>selectPlayer(p,"reserves",i,d);

    if(selectedFrom && selectedFrom.from==="reserves" && selectedFrom.index===i){
      d.classList.add("active");
    }

    r.appendChild(d);
  });
}

// ================= CORE LOGIC =================
function selectPlayer(p, from, index, el){
  selectedPlayer = p;
  selectedFrom = {from,index};
  document.querySelectorAll(".active").forEach(e=>e.classList.remove("active"));
  el.classList.add("active");
}

function placeHere(to, index){
  if(!selectedPlayer) return;

  // ambil target
  let target = null;
  if(to==="xi") target = xi[index].player;
  if(to==="bench") target = bench[index];

  // hapus dari asal
  if(selectedFrom.from==="xi") xi[selectedFrom.index].player=null;
  if(selectedFrom.from==="bench") bench[selectedFrom.index]=null;
  if(selectedFrom.from==="reserves") reserves.splice(selectedFrom.index,1);

  // taruh ke target
  if(to==="xi") xi[index].player = selectedPlayer;
  if(to==="bench") bench[index] = selectedPlayer;

  // swap balik
  if(target){
    if(selectedFrom.from==="xi") xi[selectedFrom.index].player = target;
    if(selectedFrom.from==="bench") bench[selectedFrom.index] = target;
    if(selectedFrom.from==="reserves") reserves.push(target);
  }

  clearSelection();
  drawAll();
}

function sendToReserves(){
  if(!selectedPlayer) return alert("Pilih pemain dulu");

  if(selectedFrom.from==="xi") xi[selectedFrom.index].player=null;
  if(selectedFrom.from==="bench") bench[selectedFrom.index]=null;
  if(selectedFrom.from==="reserves") return;

  reserves.push(selectedPlayer);
  clearSelection();
  drawAll();
}

function clearSelection(){
  selectedPlayer=null;
  selectedFrom=null;
  document.querySelectorAll(".active").forEach(e=>e.classList.remove("active"));
}
